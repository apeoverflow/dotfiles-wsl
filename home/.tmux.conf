# ~/.tmux.conf

# -- Prefix ------------------------------------------------------------------

# Change prefix from Ctrl+b to Ctrl+Space (no nvim conflicts).
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# -- Session root (auto-set on creation, override with: prefix+R) ------------

# Auto-capture SESSION_ROOT when a new session is created.
set-hook -g session-created 'run-shell "tmux set-environment SESSION_ROOT \"#{pane_current_path}\""'

# Prefix+R: manually set/override SESSION_ROOT to current pane's directory.
bind R run-shell 'tmux set-environment SESSION_ROOT "#{pane_current_path}" && tmux display-message "SESSION_ROOT → #{pane_current_path}"'

# -- Claude Code orchestration -----------------------------------------------

# Prefix+j: jump to the most recently finished Claude session.
bind j run-shell "~/.local/bin/claude-jump"

# Prefix+b: stage and commit all changes in current pane's directory.
bind b run-shell "~/.local/bin/claude-commit"

# Prefix+T: (unbound — test branch syncing removed; use manual git workflow)

# -- Window navigation -------------------------------------------------------

# Prefix+n/p: cycle forward/back through this session's windows. Repeatable
# (-r), so one prefix press lets you tap n/p several times.
bind -r n next-window
bind -r p previous-window

# Prefix+W: tmux built-in session/window tree.
bind W choose-tree -Zs

# Prefix+w: rich window picker with live preview of each window's output.
bind w display-popup -E -h 100% -w 100% "~/.local/bin/claude-windows"

# Strip the ✓ prefix from a window name when you visit it.
set-hook -g after-select-window 'run-shell "~/.local/bin/claude-clear-tick"'

# Prefix+c: launch Copilot via cw.
bind c display-popup -E -h 50% -w 60% "CW_INLINE_FZF=1 ~/.local/bin/claude-windows --new"

# Prefix+s: open a shell at session root.
bind s run-shell 'tmux new-window -c "$(tmux show-environment -t "#{session_name}" SESSION_ROOT 2>/dev/null | cut -d= -f2- || echo "#{pane_current_path}")"'

# Prefix+S: open a shell at current pane's directory.
bind S new-window -c "#{pane_current_path}"

# Prefix+l: open lazygit at session root.
bind l run-shell 'dir="$(tmux show-environment -t "#{session_name}" SESSION_ROOT 2>/dev/null | cut -d= -f2- || echo "#{pane_current_path}")"; tmux new-window -c "$dir" lazygit'

# Prefix+L: open lazygit at current pane's directory.
bind L new-window -c "#{pane_current_path}" lazygit

# Prefix+i/I: (unbound)

# Prefix+v: open nvim at session root.
bind v run-shell 'dir="$(tmux show-environment -t "#{session_name}" SESSION_ROOT 2>/dev/null | cut -d= -f2- || echo "#{pane_current_path}")"; tmux new-window -c "$dir" nvim'

# Prefix+V: open nvim at current pane's directory.
bind V new-window -c "#{pane_current_path}" nvim

# -- Window list styling -----------------------------------------------------

# Active window: bold with contrasting background.
set -g window-status-current-style 'bg=#3b82f6,fg=#000000,bold'
set -g window-status-current-format ' #I:#{=20:window_name} '
set -g window-status-format ' #I:#{=20:window_name} '

# Centre the window list so the active tab stays visible.
set -g status-justify centre

set -g monitor-activity off

# Compact left/right to give the window list more room.
# Narrow clients (phone/tablet-sized terminals) drop the extras so the window
# list keeps the full width: under 100 cols the clock goes, under 80 the
# session name goes too. Evaluated per client, so a wide attach still shows both.
set -g status-left '#{?#{e|<:#{client_width},80},,[#{session_name}] }'
set -g status-left-length 20
set -g status-right '#{?#{e|<:#{client_width},100},,%H:%M %d-%b}'
set -g status-right-length 20


# -- General -----------------------------------------------------------------

set -g display-time 4000
set -g history-limit 50000
set -g mouse on

# Faster key response (reduces Esc delay in nvim).
set -sg escape-time 10

# Name the outer terminal (iTerm2) tab after the current tmux session.
# Use "#S: #W" instead if you also want the active window name.
set -g set-titles on
set -g set-titles-string "#S"

# Start windows and panes at 1 for easier keyboard access.
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Terminal colours.
# tmux-256color needs its terminfo entry (ncurses-term on older Ubuntu, which
# setup.sh installs); fall back to screen-256color if it's missing.
set -g default-terminal "screen-256color"
if-shell 'infocmp tmux-256color >/dev/null 2>&1' 'set -g default-terminal "tmux-256color"'
set -ag terminal-overrides ",xterm-256color:RGB"

# OSC 52 clipboard: forward inner-app yanks out to the real terminal.
# Windows Terminal supports OSC 52, so tmux copy-mode yanks reach the Windows
# clipboard without any macOS-style helper.
set -g set-clipboard on
set -ag terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\7'

# WSL: no reattach-to-user-namespace (that's macOS-only). Open panes in zsh
# explicitly rather than trusting $SHELL — after `chsh` the login shell (and thus
# $SHELL) doesn't update until you log out/in, so tmux would otherwise open bash.
# setup.sh installs zsh at /usr/bin/zsh; fall back to $SHELL if it's not there.
if-shell '[ -x /usr/bin/zsh ]' 'set -g default-shell /usr/bin/zsh ; set -g default-command /usr/bin/zsh'


# -- Persistence across reboots ----------------------------------------------
# Restores session/window/pane layout + working dirs after a reboot, and
# re-attaches each copilot window to its exact session id. See the guide
# at ~/Code/personal/claude-bot/tmux-persistence.md.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-save a fresh snapshot every 15 min (restore stays manual: prefix+Ctrl-r).
set -g @continuum-save-interval '15'

# Save scrollback so restored panes aren't blank in the prefix+w preview.
set -g @resurrect-capture-pane-contents 'on'

# Relaunch stateless tools automatically. nvim is already in resurrect's default
# whitelist; copilot is intentionally NOT here — they are re-attached by
# session id via the hooks below instead of started fresh.
set -g @resurrect-processes 'lazygit'

# Freeze live copilot session ids at save time, then resume them on
# restore. Both scripts live in ~/.tmux/ (see the guide for how they work).
set -g @resurrect-hook-post-save-all    '~/.tmux/ai-persist-save.sh'
set -g @resurrect-hook-post-restore-all '~/.tmux/ai-persist-restore.sh'

# Keep TPM initialisation as the very last line.
run '~/.tmux/plugins/tpm/tpm'

