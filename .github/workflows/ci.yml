name: CI

# Verify the WSL dotfiles on a real Ubuntu runner: syntax-check every shell
# script, run install.sh, assert the symlinks land, and run doctor.sh.
# ~1 minute per run — negligible against the free Actions allotment.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install core dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zsh tmux git jq fzf ripgrep fd-find bat lsof uuid-runtime shellcheck

      - name: Syntax-check bash scripts (bash -n)
        run: |
          set -e
          # pick every bash-shebanged file (skips .zshrc)
          mapfile -t files < <(grep -rIl -E '^#!.*(bash|/bin/sh)' setup.sh doctor.sh install.sh home)
          for f in "${files[@]}"; do echo "bash -n $f"; bash -n "$f"; done

      - name: Syntax-check .zshrc (zsh -n)
        run: zsh -n home/.zshrc

      - name: shellcheck (errors only, non-blocking on style)
        run: |
          shellcheck -S error setup.sh doctor.sh install.sh \
            home/.tmux/*.sh home/.claude/hooks/*.sh || true

      - name: install.sh creates the expected symlinks
        run: |
          set -e
          ./install.sh
          for t in "$HOME/.zshrc" "$HOME/.tmux.conf" "$HOME/.local/bin/cw" "$HOME/.claude/hooks/lib.sh"; do
            if [ -L "$t" ]; then echo "✓ symlink: $t -> $(readlink "$t")"; else echo "✗ missing symlink: $t"; exit 1; fi
          done

      - name: install.sh is idempotent (second run is a no-op)
        run: ./install.sh

      - name: Copilot hooks registered once, other hooks kept
        run: |
          set -e
          cfg="$HOME/.copilot/settings.json"
          jq '.hooks.agentStop += [{"type":"command","bash":"/usr/bin/true"}]' "$cfg" > /tmp/s && cp /tmp/s "$cfg"
          ./install.sh >/dev/null && ./install.sh >/dev/null
          jq '.hooks' "$cfg"
          jq -e --arg h "$HOME/.claude/hooks/" '
            ([.hooks.agentStop[] | select(.bash | startswith($h))] | length) == 1 and
            ([.hooks.notification[] | select(.bash | startswith($h))] | length) == 1 and
            ([.hooks.sessionStart[] | select(.bash | startswith($h))] | length) == 1 and
            ([.hooks.agentStop[] | select(.bash == "/usr/bin/true")] | length) == 1' "$cfg" >/dev/null
          echo "✓ one entry per event, foreign hook preserved"

      # The Stop hook must never pin the agent ("Running stop hook" for minutes).
      # A fake notify-send that hangs for 60s stands in for a stuck notifier:
      # the hook has to detach it and return well inside its 8s settings timeout.
      - name: hooks return fast even with a hung notifier
        run: |
          set -e
          mkdir -p /tmp/fakebin
          printf '#!/bin/sh\nsleep 60\n' > /tmp/fakebin/notify-send && chmod +x /tmp/fakebin/notify-send
          export PATH="/tmp/fakebin:$PATH"
          run() {  # <hook> <json>
            start=$(date +%s)
            rc=0; printf '%s' "$2" | timeout 8 "$HOME/.claude/hooks/$1" || rc=$?
            took=$(( $(date +%s) - start ))
            echo "$1 exited $rc in ${took}s"
            [ "$rc" -eq 0 ] || { echo "::error::$1 exited $rc"; exit 1; }
            [ "$took" -le 3 ] || { echo "::error::$1 took ${took}s"; exit 1; }
          }
          # Payload shapes captured from Copilot CLI 1.0.97 (agentStop has no event name).
          run on-stop.sh '{"sessionId":"ci-stop","timestamp":1,"cwd":"/tmp","transcriptPath":"","stopReason":"end_turn"}'
          run on-stop.sh '{"sessionId":"ci-abort","timestamp":1,"cwd":"/tmp","transcriptPath":"","stopReason":"aborted"}'
          run on-notification.sh '{"sessionId":"ci-notif","hook_event_name":"Notification","message":"it'"'"'s waiting","notification_type":"permission_prompt"}'
          run on-session-start.sh '{"sessionId":"ci-start","timestamp":1,"cwd":"/tmp","source":"new"}'
          # claude-commit / claude-pr's `copilot -p` runs set CW_HEADLESS=1 → hooks stay silent
          printf '%s' '{"sessionId":"ci-headless","stopReason":"end_turn"}' | CW_HEADLESS=1 "$HOME/.claude/hooks/on-stop.sh"
          ! grep -q ci-headless "$HOME/.claude/hooks/debug.jsonl"
          jq -c '{step,session_id}' "$HOME/.claude/hooks/debug.jsonl"
          jq -e 'select(.session_id=="ci-abort" and .step=="skip")' "$HOME/.claude/hooks/debug.jsonl" >/dev/null
          jq -e 'select(.session_id=="ci-stop" and .step=="done")' "$HOME/.claude/hooks/debug.jsonl" >/dev/null
          echo "✓ hooks fast + debug.jsonl populated"

      - name: doctor.sh (informational — AI CLIs / optional tools absent in CI)
        run: ./doctor.sh || true

  # Actually run setup.sh on a clean Ubuntu box and assert the core tools land.
  # (Guards against the atomic-apt-failure class of bug where one bad package
  # silently takes the whole install down.)
  setup-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run setup.sh
        run: ./setup.sh
      - name: Assert core tools installed
        run: |
          set -e
          export PATH="$HOME/.local/bin:$PATH"
          missing=0
          for t in zsh tmux fzf rg bat fd btop eza node nvim; do
            if command -v "$t" >/dev/null 2>&1; then echo "✓ $t"; else echo "✗ $t MISSING"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || { echo "core tools missing after setup.sh"; exit 1; }

      - name: Assert oh-my-zsh core present and .zshrc loads cleanly
        run: |
          set -e
          test -f "$HOME/.oh-my-zsh/oh-my-zsh.sh" || { echo "✗ oh-my-zsh core (oh-my-zsh.sh) missing"; exit 1; }
          echo "✓ oh-my-zsh core present"
          ./install.sh >/dev/null          # symlink .zshrc etc. into $HOME
          # load the real interactive .zshrc and fail on any load-time error
          err=$(zsh -ic 'true' 2>&1 >/dev/null || true)
          if printf '%s' "$err" | grep -qiE "command not found|no such file or directory|setlocale"; then
            echo "::error::.zshrc emitted load errors:"; printf '%s\n' "$err"; exit 1
          fi
          echo "✓ .zshrc loads without errors"
